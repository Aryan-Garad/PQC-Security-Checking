version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sih_security_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sih_security_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih_security_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/sih_security_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
